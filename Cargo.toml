[package]
name = "sigsieve"
version = "0.1.0-alpha.2"
edition = "2021"
# Floor set by dependencies (sha2 0.11, proptest 1.12 declare 1.88) and
# clippy's incompatible_msrv lint; not built on a 1.88 toolchain in CI.
rust-version = "1.88"
description = "SSH agent filtering proxy: expose only the identities you trust."
license = "MIT"
repository = "https://github.com/semihbugrasezer/sigsieve"
readme = "README.md"
keywords = ["ssh", "ssh-agent", "security", "agent-forwarding"]
categories = ["command-line-utilities", "cryptography"]
# Allowlist for the published .crate (checked by scripts/check-crate-package.sh).
# fuzz/ is a separate package and never shipped; its seeds reach the crate
# through the tests/data/fuzz-seeds symlink, which cargo dereferences.
include = [
    "/src/**",
    "/tests/**",
    "/docs/**",
    "/examples/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE",
]

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
# Host-key signature verification for session-bind (destination binding).
# Verification only; SigSieve never holds private keys.
ed25519-dalek = { version = "3", default-features = false }
libc = "0.2"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
p521 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.11"
signal-hook = "0.4"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
